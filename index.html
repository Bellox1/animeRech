<main class="container">
  <section class="default-animes">
    <h2>Animes populaires</h2>
    <div class="default-animes-grid" id="defaultAnimes"></div>
  </section>

  <div class="search-row" role="search" aria-label="Recherche d'animes">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Rechercher un anime (ex: Blue Lock, Naruto...)" aria-label="Champ de recherche anime" />
    </div>
    <select id="resultCount" aria-label="Nombre de résultats">
      <option value="5">5 résultats</option>
      <option value="10" selected>10 résultats</option>
      <option value="15">15 résultats</option>
      <option value="20">20 résultats</option>
    </select>
    <button id="btnSearch" aria-label="Bouton rechercher anime"><i class="fas fa-search"></i> Rechercher</button>
    <button id="btnRandom" aria-label="Bouton recherche aléatoire"><i class="fas fa-random"></i> Aléatoire</button>
  </div>

  <div id="results" aria-live="polite" aria-atomic="true"></div>
