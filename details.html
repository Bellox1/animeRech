<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails - AnimeRech</title>
    <link rel="icon" href="bellox.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<style>
    /* Styles pour les plateformes de streaming */
    .streaming-platforms {
        margin: 2rem 0;
        padding: 1rem;
        background-color: #f8f9fa; /* Couleur de fond par défaut (sera recouverte par le cadre) */
        border-radius: 8px;
    }

    .streaming-platforms h3 {
        color: #2196F3;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .platforms-list {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .platform-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #000; /* Fond noir pour les cadres */
        padding: 0.5rem 1rem;
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 191, 255, 0.6), 0 0 5px rgba(255, 255, 255, 0.8); /* Bleu lumineux et blanc autour */
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        border: 1px solid rgba(0, 191, 255, 0.4); /* Bordure bleue lumineuse */
        position: relative; /* Pour l'effet de survol */
        overflow: hidden; /* Assure que le contenu ne déborde pas */
    }

    .platform-item:hover {
        transform: translateY(-5px) scale(1.02); /* Animation au survol */
        box-shadow: 0 0 25px rgba(0, 191, 255, 0.8), 0 0 10px rgba(255, 255, 255, 1);
    }

    .platform-logo {
        width: 30px;
        height: 30px;
        object-fit: contain;
        border-radius: 50%; /* Rend les logos parfaitement ronds */
        border: 1px solid rgba(255, 255, 255, 0.5); /* Petite bordure blanche autour du logo */
        transition: transform 0.2s ease-in-out; /* Animation du logo au survol */
    }

    .platform-item:hover .platform-logo {
        transform: scale(1.1); /* Zoom léger sur le logo au survol du cadre */
    }

    .platform-link {
        color: #fff; /* Texte blanc pour le lien */
        text-decoration: none;
        font-weight: 500;
        white-space: nowrap;
        transition: color 0.2s;
    }

    .platform-link:hover {
        color: #00BFFF; /* Bleu lumineux au survol */
        text-decoration: underline;
    }

    /* Styles pour les scans de manga */
    .manga-scans {
        margin: 2rem 0;
        padding: 1rem;
        background-color: #f8f9fa; /* Couleur de fond par défaut (sera recouverte par le cadre) */
        border-radius: 8px;
    }

    .manga-scans h3 {
        color: #2196F3;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .chapter-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
    }

    .chapter-item {
        background: #000; /* Fond noir pour les cadres */
        padding: 0.8rem;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 191, 255, 0.6), 0 0 5px rgba(255, 255, 255, 0.8); /* Bleu lumineux et blanc autour */
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        border: 1px solid rgba(0, 191, 255, 0.4); /* Bordure bleue lumineuse */
        position: relative; /* Pour l'effet de survol */
        overflow: hidden; /* Assure que le contenu ne déborde pas */
    }

    .chapter-item:hover {
        transform: translateY(-5px) scale(1.02); /* Animation au survol */
        box-shadow: 0 0 25px rgba(0, 191, 255, 0.8), 0 0 10px rgba(255, 255, 255, 1);
    }

    .chapter-item a {
        text-decoration: none;
        color: #fff; /* Texte blanc pour le lien */
        font-weight: 500;
        display: block;
        transition: color 0.2s;
    }

    .chapter-item a:hover {
        color: #00BFFF; /* Bleu lumineux au survol */
    }

    /* Styles pour la description */
    .synopsis h3 {
        color: #2196F3;
    }
    .synopsis .original-text {
        margin-top: 1em;
        font-size: 0.9em;
        color: #666;
        border-top: 1px dashed #eee;
        padding-top: 0.5em;
    }

    /* Le reste de vos styles existants */
    .anime-card-link {
        display: block;
        text-decoration: none;
        color: inherit;
    }

    .anime-card {
        transition: transform 0.3s, box-shadow 0.3s;
        border-radius: 8px;
        overflow: hidden;
        background: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        margin-bottom: 1rem;
    }

    .anime-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    /* Page détails */
    .anime-details-container {
        padding: 1rem;
    }

    .anime-header {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
        .anime-header {
            flex-direction: row;
        }
    }

    .anime-poster {
        width: 100%;
        max-width: 300px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
.anime-poster {
  transition: transform 0.3s ease; /* Ajoute une transition douce */
}

.anime-poster:hover {
  transform: scale(1.2); /* Augmente la taille de l'image de 20% au survol */
}
    .meta-grid {
        color: #2196F3;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0;
    }

    .meta-grid div {
        background: #f5f5f5;
        padding: 0.5rem;
        border-radius: 4px;
    }

    .genre-list span {
        display: inline-block;
        background: #e1f5fe;
        color: #0288d1;
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        font-size: 0.8rem;
    }

    .trailer-btn, .back-btn {
        display: inline-block;
        padding: 0.8rem 1.5rem;
        background: #2196F3;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        margin-top: 1rem;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
    }
</style>
</head>
<body>
    <header class="visible">
        <h1><i class="fas fa-info-circle"></i> Détails de l'Anime</h1>
        <button id="menuToggleButton" class="menu-toggle" aria-label="Ouvrir le menu de navigation">
            <div class="icon-container">
                <i class="fas fa-bars"></i>
                <i class="fas fa-times"></i>
            </div>
        </button>
    </header>

    <div id="overlay" class="overlay"></div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()" aria-label="Fermer le menu de navigation">&times;</a>
        <h1>AnimeRech</h1>
        <a href="index.html"><i class="fas fa-home"></i> Accueil</a>
        <a href="about.html"><i class="fas fa-info-circle"></i> À propos</a>
        <a href="help.html"><i class="fas fa-question-circle"></i> Aide</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
        <a href="privacy.html"><i class="fas fa-shield-alt"></i> Confidentialité</a>
    </div>

    <main class="container">
        <div id="anime-details" class="anime-details-container">
            <div id="loadingSpinner" class="loading-spinner">
                <div class="spinner-border"></div>
                <p>Chargement des détails...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="about.html"><i class="fas fa-info-circle"></i> À propos</a>
                <a href="help.html"><i class="fas fa-question-circle"></i> Aide</a>
                <a href="mailto:matinoubello123@gmail.com">
                    <i class="fas fa-envelope"></i>Email
                </a>
                <a href="privacy.html"><i class="fas fa-shield-alt"></i> Confidentialité</a>
            </div>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/matinoubello" target="_blank" rel="noopener noreferrer" aria-label="Linkedin">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://www.facebook.com/matinou.bello.2025" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://www.instagram.com/the_famous_0001" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" aria-label="Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; <span id="year"></span> AnimeRech - Tous droits réservés
            </div>

            <script>
                document.getElementById("year").textContent = new Date().getFullYear();
            </script>
        </div>
    </footer>

    <script>
        
        // Sidebar functions
        function openNav() {
            mySidebar.classList.add('open');
            overlay.classList.add('active');
            menuToggleButton.classList.add('open');
            document.body.style.overflow = "hidden";
        }

        function closeNav() {
            mySidebar.classList.remove('open');
            overlay.classList.remove('active');
            menuToggleButton.classList.remove('open');
            document.body.style.overflow = "";
        }

        // Toggle sidebar
        const menuToggleButton = document.getElementById('menuToggleButton');
        const mySidebar = document.getElementById('mySidebar');
        const overlay = document.getElementById('overlay');

        menuToggleButton.addEventListener('click', () => {
            if (mySidebar.classList.contains('open')) {
                closeNav();
            } else {
                openNav();
            }
        });

        // Close sidebar when clicking on overlay
        overlay.addEventListener('click', closeNav);

        // Close sidebar when clicking on a link (except closebtn)
        document.querySelectorAll('.sidebar a:not(.closebtn)').forEach(link => {
            link.addEventListener('click', closeNav);
        });

        // Close sidebar when pressing Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && mySidebar.classList.contains('open')) {
                closeNav();
            }
        });

        // Clé API et URL de traduction
        // IMPORTANT: Remplacez 'VOTRE_CLE_API_GOOGLE_TRANSLATION' par votre clé API réelle
        const API_KEY = 'AIzaSyB2SadMOnczEv9gwQI2I2rpZNme9eeMvM0';
        const TRANSLATE_URL = `https://translation.googleapis.com/language/translate/v2?key=${API_KEY}`;

        // Fonction de traduction
        const translateText = async (text, targetLang = 'fr') => {
            if (!text) return '';
            try {
                const response = await fetch(TRANSLATE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: text, target: targetLang, format: 'text' })
                });
                const data = await response.json();
                return data.data?.translations?.[0]?.translatedText || text;
            } catch (error) {
                console.error("Erreur de traduction:", error);
                return text; // Retourne le texte original en cas d'erreur
            }
        };

        // Logos prédéfinis pour les plateformes de streaming
        // Logos prédéfinis pour les plateformes de streaming
const predefinedPlatformLogos = {
    "Crunchyroll": "https://i.pinimg.com/736x/89/fc/de/89fcdebedfdcf2bf3a00a49d75833c3a.jpg", // Le favicon est une petite version du logo, souvent stable.
    "Netflix": "https://i.pinimg.com/736x/12/d0/45/12d04587f205ba8accecb35de93f790b.jpg", // Celui-ci semble stable
    "Hulu": "https://i.pinimg.com/736x/a9/8b/48/a98b489857b13942ef79fe8d572c88e3.jpg", // Le favicon est souvent un bon fallback
    "Funimation": "https://i.pinimg.com/736x/67/39/62/673962d4358068659cd464facf136f09.jpg",
    "Amazon Prime Video": "https://i.pinimg.com/736x/50/93/14/50931435353f354ea2ec06edf6e96ac9.jpg",
    "Disney+": "https://i.pinimg.com/736x/e7/29/f2/e729f2da6941ab04b7d603d43f911569.jpg",
    "HBO Max": "https://i.pinimg.com/736x/01/39/44/013944d1f402db6d369ab9b6e38fdc77.jpg",
    "YouTube": "https://i.pinimg.com/736x/3a/36/20/3a36206f35352b4230d5fc9f17fcea92.jpg",
    "ADN (Anime Digital Network)": "https://i.pinimg.com/736x/a7/aa/48/a7aa48d724a84a1fdfaa7bfd55d178f6.jpg",
    "Animax Asia": "https://i.pinimg.com/736x/9f/f3/9d/9ff39dfd474f05fe1790a5159ec8945f.jpg", // Lien direct vers une taille spécifique sur Wikimedia
    "Aniplus TV": "https://i.pinimg.com/736x/cd/4e/1a/cd4e1af9a26bb35fbeac183251944980.jpg", // Le favicon d'Aniplus TV
    "Bilibili": "https://www.bilibili.com/favicon.ico", // Le favicon de Bilibili
    "Bilibili Global": "https://www.bilibili.com/favicon.ico", // Même favicon pour la version globale
    "Laftel": "https://play-lh.googleusercontent.com/7G_dKdVbYMiPFGlDutD7IIUThshskLe2kgJhWrIyU3CkHsSK94rl92jauO2w7L4Fyg" // Le favicon de Laftel
};
        // Fonction pour récupérer les scans de manga
        const getMangaScans = async (mangaTitle) => {
            try {
                // 1. Rechercher le manga sur MangaDex par titre
                const searchResponse = await fetch(`https://api.mangadex.org/manga?title=${encodeURIComponent(mangaTitle)}&limit=1`);
                if (!searchResponse.ok) {
                    console.warn(`MangaDex search failed for "${mangaTitle}": ${searchResponse.status}`);
                    return [];
                }
                const searchData = await searchResponse.json();
                if (!searchData.data || searchData.data.length === 0) {
                    console.warn(`No manga found on MangaDex for title: "${mangaTitle}"`);
                    return [];
                }

                const mangadexMangaId = searchData.data[0].id;

                // 2. Récupérer les chapitres du manga via MangaDex
                const chaptersResponse = await fetch(`https://api.mangadex.org/manga/${mangadexMangaId}/feed?translatedLanguage[]=fr&translatedLanguage[]=en&order[chapter]=asc&limit=500`); // Augmenter la limite
                if (!chaptersResponse.ok) {
                    console.warn(`Failed to fetch chapters for MangaDex ID ${mangadexMangaId}: ${chaptersResponse.status}`);
                    return [];
                }
                const chaptersData = await chaptersResponse.json();

                // Filtrer les chapitres: pas de liens externes et avec des pages
                const chapters = chaptersData.data.filter(chapter =>
                    chapter.attributes.externalUrl === null &&
                    chapter.attributes.pages > 0 &&
                    (chapter.attributes.translatedLanguage === 'fr' || chapter.attributes.translatedLanguage === 'en')
                );

                // Trier les chapitres numériquement
                chapters.sort((a, b) => {
                    const chapterA = parseFloat(a.attributes.chapter);
                    const chapterB = parseFloat(b.attributes.chapter);
                    return chapterA - chapterB;
                });

                return chapters.map(chapter => {
                    const chapterNumber = chapter.attributes.chapter;
                    const chapterTitle = chapter.attributes.title || `Chapitre ${chapterNumber}`;
                    const chapterId = chapter.id;

                    return {
                        number: chapterNumber,
                        title: chapterTitle,
                        id: chapterId,
                        mangaId: mangadexMangaId // Ajout de l'ID du manga
                    };
                });

            } catch (error) {
                console.error("Erreur lors de la récupération des scans MangaDex:", error);
                return [];
            }
        };


        // Gestion des détails de l'anime
        document.addEventListener('DOMContentLoaded', async () => {
            const animeId = new URLSearchParams(window.location.search).get('id');
            if (!animeId) return window.location.href = 'index.html';

            try {
                // Récupérer les détails de l'anime
                const response = await fetch(`https://api.jikan.moe/v4/anime/${animeId}`);
                if (!response.ok) throw new Error('Anime non trouvé');
                const anime = (await response.json()).data;

                // Récupérer les plateformes de streaming
                let streamingPlatforms = [];
                try {
                    const streamingResponse = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/streaming`);
                    if (streamingResponse.ok) {
                        const streamingData = await streamingResponse.json();
                        streamingPlatforms = streamingData.data || [];

                        // Mapper les plateformes avec les logos prédéfinis ou un placeholder
                        streamingPlatforms = streamingPlatforms.map(platform => {
                            const logoUrl = predefinedPlatformLogos[platform.name] || `https://via.placeholder.com/30x30?text=${encodeURIComponent(platform.name.substring(0, 2))}`;
                            return {
                                ...platform,
                                logo: logoUrl
                            };
                        });
                    }
                } catch (e) {
                    console.error("Erreur lors de la récupération des plateformes de streaming:", e);
                }

                // --- Gestion de la description (originale et traduite) ---
                const synopsisOriginal = anime.synopsis || 'Pas de description disponible.';
                let synopsisTranslated = synopsisOriginal;

                if (synopsisOriginal && API_KEY && API_KEY !== 'VOTRE_CLE_API_GOOGLE_TRANSLATION') {
                    synopsisTranslated = await translateText(synopsisOriginal, 'fr');
                } else if (!API_KEY || API_KEY === 'VOTRE_CLE_API_GOOGLE_TRANSLATION') {
                    console.warn("Clé API Google Cloud Translation manquante ou générique. La traduction ne sera pas effectuée.");
                }

                // Récupérer les scans du manga
                let mangaScans = [];
                if (anime.title) {
                    mangaScans = await getMangaScans(anime.title);
                }

                // Générer le HTML pour les plateformes de streaming
                let streamingHTML = '';
                if (streamingPlatforms.length > 0) {
                    streamingHTML = `
                        <section class="streaming-platforms">
                            <h3><i class="fas fa-play-circle"></i> Disponible sur</h3>
                            <div class="platforms-list">
                                ${streamingPlatforms.map(platform => `
                                    <div class="platform-item">
                                        <img src="${platform.logo}" alt="${platform.name}" class="platform-logo">
                                        <a href="${platform.url}" target="_blank" class="platform-link">
                                            ${platform.name}
                                        </a>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                }

                // Générer le HTML pour les scans de manga
                let mangaScansHTML = '';
                if (mangaScans.length > 0) {
                    mangaScansHTML = `
                        <section class="manga-scans">
                            <h3><i class="fas fa-book-open"></i> Scans du Manga</h3>
                            <div class="chapter-list">
                                ${mangaScans.map(scan => `
                                    <div class="chapter-item">
                                            <a href="manga-reader.html?chapterId=${scan.id}&title=${encodeURIComponent(anime.title)}&chapterNum=${scan.number}&mangaId=${scan.mangaId}" target="_blank">
                                            Chapitre ${scan.number}${scan.title && scan.title !== `Chapitre ${scan.number}` ? `: ${scan.title}` : ''}
                                        </a>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                }

                document.getElementById('anime-details').innerHTML = `
                    <div class="anime-header">
                        <img src="${anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || 'https://via.placeholder.com/300x400?text=Pas+d\'image'}"
                            alt="${anime.title}"
                            class="anime-poster" />
                        <div class="anime-info">
                            <h1>${anime.title}</h1>
                            ${anime.title_japanese ? `<h2>${anime.title_japanese}</h2>` : ''}

                            <div class="meta-grid">
                                ${anime.score ? `<div><i class="fas fa-star"></i> ${anime.score.toFixed(1)}/10</div>` : ''}
                                ${anime.episodes ? `<div><i class="fas fa-tv"></i> ${anime.episodes} épisodes</div>` : ''}
                                ${anime.status ? `<div><i class="fas fa-info-circle"></i> ${anime.status}</div>` : ''}
                                ${anime.aired?.string ? `<div><i class="fas fa-calendar-alt"></i> ${anime.aired.string}</div>` : ''}
                            </div>

                            ${anime.trailer?.url ? `
                                <a href="${anime.trailer.url}" target="_blank" class="trailer-btn">
                                    <i class="fas fa-play"></i> Bande-annonce
                                </a>
                            ` : ''}
                        </div>
                    </div>

                    <div class="anime-content">
                        <section class="synopsis">
                            <h3>Synopsis</h3>
                            <p>${synopsisTranslated}</p>
                            ${synopsisOriginal !== synopsisTranslated ? `<p class="original-text"><b>Texte Original:</b> ${synopsisOriginal}</p>` : ''}
                        </section>

                        ${streamingHTML}

                        ${mangaScansHTML}

                        ${anime.genres?.length ? `
                            <section class="genres">
                                <h3>Genres</h3>
                                <div class="genre-list">
                                    ${anime.genres.map(g => `<span>${g.name}</span>`).join('')}
                                </div>
                            </section>
                        ` : ''}

                        ${anime.studios?.length ? `
                            <section class="studios">
                                <h3>Studios</h3>
                                <p>${anime.studios.map(s => s.name).join(', ')}</p>
                            </section>
                        ` : ''}

                        <a href="index.html" class="back-btn">
                            <i class="fas fa-arrow-left"></i> Retour à la recherche
                        </a>
                    </div>
                `;
            } catch (error) {
                document.getElementById('anime-details').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i> ${error.message}
                        <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
                    </div>
                `;
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
